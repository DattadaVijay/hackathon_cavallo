resources:
  jobs:
    nasa_forecast:
      name: nasa_forecast
      tags:
        domain: nasa forecasting
 
      tasks:
 
        - task_key: data_extraction
          max_retries: 0
          notebook_task:
            notebook_path: ../src/bronze/data_loading.py
 
        - task_key: data_ingestion
          max_retries: 0
          depends_on: 
            - task_key: data_extraction
          notebook_task:
            notebook_path: ../src/bronze/data_ingestion.py
 
        - task_key: bronze_silver
          max_retries: 0
          depends_on:
            - task_key: data_ingestion
          notebook_task:
            notebook_path: ../src/silver/bronze_to_silver.py

        - task_key: iss_telemetry_dashboard
          depends_on:
            - task_key: bronze_silver
          dashboard_task:
            subscription:
              subscribers:
                - user_name: dattada.vijay@gmail.com
              paused: true
            warehouse_id: ece081f3bd7cb8a7
            dashboard_id: 01f1014d93781590a42a2362048b5c8c